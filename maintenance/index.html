<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Maintenance | Tastes by T</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #fffaf3;
      color: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      height: 100vh;
      text-align: center;
    }
    .container {
      max-width: 600px;
      padding: 20px;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 0.5rem;
      color: #c05a32;
    }
    p {
      font-size: 1.2rem;
    }
    .logo {
      width: 100px;
      margin-bottom: 20px;
    }
    .cake-timer {
      position: relative;
      width: 80px;
      height: 80px;
      margin: 30px auto 0;
      background: #f5c5a6;
      border-radius: 50%;
      border: 6px solid #c05a32;
      box-shadow: inset 0 0 5px rgba(0,0,0,0.1);
    }
    .cake-hand {
      position: absolute;
      width: 6px;
      height: 35px;
      background: #c05a32;
      top: 5px;
      left: 37px;
      transform-origin: bottom center;
      animation: tick 4s infinite linear;
      border-radius: 3px;
    }
    @keyframes tick {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(-360deg); }
      100% { transform: rotate(0deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="../Assets/Tia logo.jpg" alt="Tastes by T Logo" class="logo" />
    <h1>We're Cooking Something Up!</h1>
    <p>Our website is currently undergoing scheduled maintenance.<br />
    We’ll be back shortly with something fresh and tasty!</p>
    <div class="cake-timer">
      <div class="cake-hand"></div>
    </div>
  </div>
</body>
</html>
