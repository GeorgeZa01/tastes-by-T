        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Georgia', 'serif'], 
                    },
                    colors: {
                        // Base Colors: White and Black
                        'brand-white': '#FFFFFF', 
                        'brand-black': '#000000', 
                        
                        // Pink Palette
                        'brand-pastel': '#FDCEDA', // Light, soft Pastel Pink for hero/sections
                        'brand-hotpink': '#FF69B4', // Vibrant Hot Pink for accents/buttons
                    },
                },
                // Custom animations for loading state
                keyframes: {
                    dotPulse: {
                        '0%, 100%': { opacity: '0.2' },
                        '40%': { opacity: '1' },

                },

                    dotPulse: 'dotPulse 1.5s infinite ease-in-out',

    <style>
        /* --- GLOBAL BACKGROUND STYLES FOR RESPONSIVENESS --- */
        body { 
            font-family: 'Inter', sans-serif; 
            /* Set the background image and ensure it covers the screen and is fixed */
            background-color: #FEEFEF; /* Fallback light pink color */
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- CONTENT READABILITY STYLES (Adding White Backgrounds to main areas) --- */
        /* Ensure the main container has a white background for text legibility over the pattern */
        #root {
            background-color: rgba(255, 255, 255, 0.95); /* A slight translucent white for depth */
            min-height: 100vh; /* Ensure the white overlay covers the full height */
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.1); /* Subtle shadow effect */
            /* Using a simple background pattern/image that's subtle */
            background-image: url('https://static.vecteezy.com/system/resources/previews/035/845/687/large_2x/ai-generated-pink-birthday-cake-on-the-pink-background-free-photo.jpg');

            background-repeat: no-repeat;
            background-size: cover; /* Use 'auto' or 'cover' depending on preference. 'repeat' works best for subtle patterns. */
            background-attachment: fixed; /* Ensures a smooth experience on mobile devices */
        }

        /* Styling for the call-to-action button */
        .order-btn {
            transition: all 0.2s ease-in-out;
            /* Shadow using black/hotpink mix */
            box-shadow: 0 4px 15px rgba(255, 105, 180, 0.4); 
        }
        .order-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 105, 180, 0.6);
        }
        /* Ensure main content takes available space and centers */
        #app-content {
            flex-grow: 1;
            max-width: 80rem; /* max-w-7xl */
            width: 100%;
            margin-left: auto;
            margin-right: auto;
            /* Added min-width: 0 to ensure robust handling of overflowing content on small screens (essential for mobile responsiveness) */
            min-width: 0; 
        }
        /* Custom dot animation for loading */
        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #FF69B4;
            margin: 0 2px;
            opacity: 0.2;
        }
        .dot:nth-child(1) { animation: dotPulse 1.5s infinite ease-in-out; }
        .dot:nth-child(2) { animation: dotPulse 1.5s infinite ease-in-out 0.2s; }
        .dot:nth-child(3) { animation: dotPulse 1.5s infinite ease-in-out 0.4s; }
    </style>

        const renderRecommendationSection = () => {

</div>

        const renderHomeContent = () => {

<div class="flex flex-wrap justify-center gap-6 sm:gap-8">

        const renderCategoryContent = (categoryId) => {

<div class="text-center mb-10 sm:mb-12">

<div class="flex flex-wrap justify-center gap-4 sm:gap-6">

        const renderNotFoundContent = () => {
            return `
                <div class="min-h-[50vh] flex flex-col items-center justify-center p-4 sm:p-8">

                        <p class="text-lg sm:text-xl mb-6">Apologies! The page you were looking for seems to have been eaten.</p>
                        <a

        const renderFooter = () => {

            return `
                <footer class="bg-brand-black mt-12 pt-8 sm:pt-10 pb-4 rounded-t-xl text-brand-white">
                    

<div class="max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-4 gap-6 sm:gap-8">
                        

<div>
                            <h5 class="text-2xl sm:text-3xl font-serif font-bold mb-3 text-brand-hotpink"> <img src="./assets/tastesbyt-logo.jpg" alt="Logo" class="w-full rounded h-100 inline-block mr-2"></h5>

                        </div>
                        

<div>

<p>Cape Town, Western Cape, South Africa</p>

                        </div>
                        

<div>

                                <li><a href="#home" class="hover:text-brand-hotpink transition-colors">Home</a></li>

<div>

                                <li><a href="https://www.facebook.com/share/168kW4dQ2H/" target="_blank" class="hover:text-brand-hotpink transition-colors">Facebook</a></li>
                                <li><a href="https://www.tiktok.com/@tastes.by.t" target="_blank" class="hover:text-brand-hotpink transition-colors">Tiktok</a></li>
                            </ul>
                        </div>
                    </div>
                    <div class="text-center mt-8 pt-4 border-t border-brand-white/20">
                        <p class="text-xs opacity-60">&copy; 2024 Tastes By T | All rights reserved.</p>
                    </div>
                </footer>
            `;
        };


        // --- 4. GEMINI API LOGIC FOR RECOMMENDATION ---

        /**
         * Helper function to execute API call with exponential backoff.
         * @param {Object} payload - The request body for the generateContent API.
         * @param {number} maxRetries - Maximum number of retries.
         * @param {number} initialDelay - Initial delay in milliseconds.
         * @returns {Promise<Object|null>} The JSON response or null on failure.
         */
        const fetchWithBackoff = async (payload, maxRetries = 5, initialDelay = 1000) => {
            for (let attempt = 0; attempt < maxRetries; attempt++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        return await response.json();
                    } else if (response.status === 429 && attempt < maxRetries - 1) {
                        // Rate limit error, retry after delay
                        const delay = initialDelay * (2 ** attempt) + Math.random() * 1000;
                        await new Promise(resolve => setTimeout(resolve, delay));
                        continue; // Skip to the next attempt
                    } else {
                        // Non-retryable error or last attempt failed
                        throw new Error(`API call failed with status: ${response.status}`);
                    }
                } catch (error) {
                    console.error("Fetch attempt failed:", error);
                    if (attempt === maxRetries - 1) {
                        return null; // All retries failed
                    }
                    const delay = initialDelay * (2 ** attempt) + Math.random() * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
            return null; // Should not be reached if maxRetries > 0
        };


        /**
         * Generates a dessert recommendation based on user input using the Gemini API.
         */
        const generateRecommendation = async () => {
            const inputElement = document.getElementById('recommendation-input');
            const outputDiv = document.getElementById('recommendation-output');
            const prompt = inputElement.value.trim();

            if (!prompt) {
                outputDiv.innerHTML = `<p class="text-red-500 text-center mt-4">Please tell us what you're looking for!</p>`;
                return;
            }

            // Show Loading State
            outputDiv.innerHTML = `
                <div class="text-center text-brand-black font-semibold mt-4 flex items-center justify-center">
                    <span class="mr-2">Finding the perfect treat</span>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            `;

            // Available menu items for the model to reference
            const menuContext = CATEGORIES.map(cat => ({
                category: cat.title,
                id: cat.id,
                items: cat.products.map(p => p.name).join(', ')
            }));
            
            const systemPrompt = `You are a dessert sommelier for Tastes By T. Based on the user's request, recommend exactly ONE item from the following menu, providing a fun and compelling rationale. The response must be a single JSON object matching the provided schema. Menu context: ${JSON.stringify(menuContext)}`;
            
            const userQuery = `Based on my request: "${prompt}", which of the Tastes By T products do you recommend?`;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] },
                generationConfig: {
                    responseMimeType: "application/json",
                    responseSchema: {
                        type: "OBJECT",
                        properties: {
                            "productName": { 
                                "type": "STRING", 
                                "description": "The exact name of the recommended product." 
                            },
                            "rationale": { 
                                "type": "STRING", 
                                "description": "A 1-2 sentence, enthusiastic reason for the recommendation based on the user's prompt." 
                            },
                            "suggestedCategory": { 
                                "type": "STRING", 
                                "description": "The ID of the category this product belongs to (cakes, cupcakes, party-packs, or wantmore). This can sometimes be null or incorrect." 
                            }
                        },
                        "propertyOrdering": ["productName", "rationale", "suggestedCategory"]
                    }
                }
            };

            const result = await fetchWithBackoff(payload);

            if (result && result.candidates && result.candidates.length > 0) {
                try {
                    const jsonString = result.candidates[0].content.parts[0].text;
                    const data = JSON.parse(jsonString);

                    // Robustly find the category link by checking all product lists
                    let categoryLink = '#home'; // Default to home if product not found
                    let foundCategory = false;
                    
                    for (const cat of CATEGORIES) {
                        if (cat.products.some(p => p.name.toLowerCase() === data.productName.toLowerCase())) {
                            categoryLink = `#category/${cat.id}`;
                            foundCategory = true;
                            break;
                        }
                    }

                    outputDiv.innerHTML = `
                        <div class="bg-brand-white p-5 rounded-xl border border-brand-hotpink/50 shadow-md">
                            <h3 class="text-2xl font-bold text-brand-hotpink mb-2 text-center">We Recommend: ${data.productName}</h3>
                            <p class="text-gray-700 text-center mb-4 italic">"${data.rationale}"</p>
                            <div class="text-center">
                                <a 
                                    href="${categoryLink}"
                                    class="inline-block bg-brand-black text-white font-semibold py-2 px-6 rounded-full hover:bg-brand-hotpink transition-colors"
                                >
                                    ${foundCategory ? `Explore ${data.productName}` : 'View Our Full Menu'}
                                </a>
                            </div>
                        </div>
                    `;
                } catch (e) {
                    console.error("Error parsing JSON response or rendering:", e);
                    outputDiv.innerHTML = `<p class="text-red-500 text-center mt-4">Sorry, we couldn't process that recommendation. Please try again!</p>`;
                }
            } else {
                outputDiv.innerHTML = `<p class="text-red-500 text-center mt-4">Sorry, we couldn't fetch a recommendation at this time. Please check your connection.</p>`;
            }
        };


        // --- 5. ROUTING & INITIALIZATION LOGIC ---

        /**
         * Determines the current page based on the URL hash and renders the content.
         */
        const handleRouting = () => {
            const root = document.getElementById('root');
            let contentHTML = '';

            // 1. Close menu on new route/render
            isMenuOpen = false;
            
            // Get content after '#' (e.g., '#category/cakes' or just '')
            const hash = window.location.hash.slice(1); 
            
            if (hash === '' || hash === 'home') {
                contentHTML = renderHomeContent();
            } else if (hash.startsWith('category/')) {
                const categoryId = hash.split('/')[1];
                contentHTML = renderCategoryContent(categoryId);
            } else {
                contentHTML = renderNotFoundContent();
            }
            
            // 2. Render the entire layout (Header, Main Content, Footer)
            root.innerHTML = `
                ${renderHeader()}
                <main id="app-content">
                    ${contentHTML}
                </main>
                ${renderFooter()}
            `;
            
            // Re-apply the initial state of the menu icon based on the current 'isMenuOpen' value (which is false after reset)
            const iconContainer = document.getElementById('menu-icon-container');
            if (iconContainer) {
                iconContainer.innerHTML = isMenuOpen ? CLOSE_ICON : HAMBURGER_ICON;
            }

            // 3. Attach Event Listeners (Must happen after innerHTML is set)
            
            // Mobile Menu Toggle
            const menuToggleBtn = document.getElementById('menu-toggle');
            if (menuToggleBtn) {
                menuToggleBtn.addEventListener('click', toggleMenu);
            }

            // Recommendation Button (Only exists on the home page)
            const recButton = document.getElementById('recommendation-button');
            if (recButton) {
                recButton.addEventListener('click', generateRecommendation);
            }

            // 4. Attach link click listener to close menu immediately
            document.querySelectorAll('#mobile-nav-content a').forEach(link => {
                link.addEventListener('click', () => {
                    // Check if the menu is open before closing (to avoid needless DOM updates)
                    if (isMenuOpen) toggleMenu();
                });
            });


            // Default to #home if no hash is present
            if (window.location.hash === '' || window.location.hash === '#') {
                window.location.hash = '#home';
            }
            
            // Scroll to top on new page load
            window.scrollTo(0, 0);
        };

        // Attach routing logic to window events
        window.onload = handleRouting;
        window.addEventListener('hashchange', handleRouting);
    </script>
